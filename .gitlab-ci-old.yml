# GitLab CI/CD Pipeline for Workers SDK CI Analyzer
# 
# Prerequisites:
# 1. Set these CI/CD variables in GitLab (Settings > CI/CD > Variables):
#    - CLOUDFLARE_API_TOKEN (Protected, Masked)
#    - CLOUDFLARE_ACCOUNT_ID (Protected) - Value: f7f78ebb28c2a224a9a46a3007350b7a
#
# 2. After first deploy, set the GITHUB_TOKEN worker secret:
#    wrangler secret put GITHUB_TOKEN

include:
  - component: $CI_SERVER_FQDN/cloudflare/ci/wrangler2/deploy@~latest
    inputs:
      stage: deploy
      NODE_VERSION: "20"
      runOnBranches: "^main$"
      CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN

  - component: $CI_SERVER_FQDN/cloudflare/ci/ai/opencode@~latest
    inputs:
      runOnMR: true

stages: [deploy]
